# Render：網頁 + Telegram Bot
# Bot 用 worker + polling（不要設 WEBHOOK_URL；worker 沒有公開 HTTP）。
# 密鑰請在 Render 儀表板填，勿寫入此檔。
# starter 要付費；若暫時只開得起一個服務，優先保 bot 活著，網頁可晚一點。

services:
  - type: web
    name: paperfilter-web
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: node dist/server.cjs
    healthCheckPath: /api/auth/config
    envVars:
      - key: NODE_ENV
        value: production
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: WEB_APP_URL
        sync: false

  - type: worker
    name: paperfilter-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: WEB_APP_URL
        sync: false
      - key: ADMIN_USER_IDS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
